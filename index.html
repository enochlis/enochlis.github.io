<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>東京・河口湖 七日小旅行</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFCF6;--ink:#3E3A39;--co:#F2A497;--ye:#F6D27A;--bl:#A8D3E6;--gr:#B9DAA5;--b:3px solid #3E3A39;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{background:var(--bg);color:var(--ink);font:16px/1.7 "Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;overflow-x:hidden}
nav{position:fixed;top:0;left:0;right:0;z-index:20;height:calc(58px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 10px 0;background:var(--bg);border-bottom:var(--b);display:flex;align-items:center;gap:8px}
nav b{white-space:nowrap;font-size:1rem}
.links{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:3px 2px}
.links::-webkit-scrollbar{display:none}
.links a{flex:none;color:var(--ink);text-decoration:none;font-size:.9rem;border:var(--b);border-radius:99px;padding:0 12px;background:var(--c)}
.links a:nth-child(4n+1){--c:var(--co)}.links a:nth-child(4n+2){--c:var(--ye)}.links a:nth-child(4n+3){--c:var(--bl)}.links a:nth-child(4n){--c:var(--gr)}
main{max-width:720px;margin:0 auto;padding:68px 16px 40px}
.card{background:var(--bg);border:var(--b);border-radius:26px;padding:16px;box-shadow:0 5px 0 var(--ink);margin-bottom:18px}
.h{display:inline-block;margin:34px 0 14px;padding:1px 20px;background:var(--c);border:var(--b);border-radius:99px;font-size:1.2rem;font-weight:400;transform:rotate(-1.5deg)}
.hero{text-align:center;padding:0;overflow:hidden}
.hero svg{display:block;width:100%;height:auto;border-bottom:var(--b)}
.hero .in{padding:14px 16px 18px}
h1{font-size:1.7rem;line-height:1.3;font-weight:400}
.sub{font-size:.9rem;margin-top:4px}
.cd{display:flex;gap:8px;justify-content:center;margin-top:14px}
.cd div{flex:1;max-width:76px;border:var(--b);border-radius:18px;padding:4px 0;background:var(--c)}
.cd div:nth-child(1){--c:var(--co)}.cd div:nth-child(2){--c:var(--ye)}.cd div:nth-child(3){--c:var(--bl)}.cd div:nth-child(4){--c:var(--gr)}
.cd strong{display:block;font-size:1.6rem;line-height:1.2;font-weight:400}.cd span{font-size:.75rem}
#cdl{margin-top:12px;font-size:.95rem}
.fl{margin-bottom:18px}
.fh{display:inline-block;border:var(--b);border-radius:99px;padding:0 14px;background:var(--bl);font-size:.9rem}
.fl:nth-child(2) .fh{background:var(--ye)}
.rt{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:6px 0}
.rt div{text-align:center}.rt strong{display:block;font-size:1.7rem;font-weight:400;line-height:1.2}.rt svg{flex:1;max-width:190px;height:auto}
.fl p{font-size:.92rem}
.muted{font-size:.82rem;opacity:.75;margin-top:6px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 4px 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;font:inherit;color:var(--ink);cursor:pointer;background:var(--bg);border:var(--b);border-radius:18px;padding:2px 12px;line-height:1.35;text-align:center}
.tab small{display:block;font-size:.72rem}
.tab[aria-selected=true]{background:var(--co);animation:bounce .5s}
.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.dt{font-size:1.15rem}.dl{font-size:.85rem;margin-bottom:12px}
.tl{list-style:none;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:11px;top:10px;bottom:14px;border-left:3px dashed var(--ink)}
.tl li{position:relative;padding:0 0 14px 40px;line-height:1.5}
.tl li::before{content:"";position:absolute;left:2px;top:3px;width:20px;height:20px;border:var(--b);border-radius:50%;background:var(--c)}
.tl li:nth-child(4n+1){--c:var(--co)}.tl li:nth-child(4n+2){--c:var(--ye)}.tl li:nth-child(4n+3){--c:var(--bl)}.tl li:nth-child(4n){--c:var(--gr)}
.tm{display:block;font-size:.78rem;opacity:.75}
.tag{display:inline-block;margin:3px 5px 0 0;padding:0 9px;border:2px solid var(--ink);border-radius:99px;font-size:.76rem;line-height:1.5;background:var(--tc)}
.must{background:var(--co);transform:rotate(-4deg);font-weight:700}
.note{background:var(--ye);border:var(--b);border-radius:18px;padding:8px 14px;font-size:.92rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips span{border:2px solid var(--ink);border-radius:99px;padding:0 10px;font-size:.85rem;background:var(--gr)}
.stay{display:flex;gap:12px;align-items:flex-start}
.stay svg{flex:none;width:54px;height:54px}
.stay h3{font-size:1.05rem;font-weight:400;line-height:1.35}.stay p{font-size:.9rem}
.pg{font-size:.85rem;margin:-6px 0 8px;opacity:.8}
.cat{font-size:.9rem;margin:10px 0 2px;display:inline-block;border:2px solid var(--ink);border-radius:99px;padding:0 10px;background:var(--bl)}
.ck{display:flex;gap:10px;align-items:center;padding:5px 0;cursor:pointer;line-height:1.4}
.ck input{appearance:none;-webkit-appearance:none;flex:none;width:26px;height:26px;margin:0;border:var(--b);border-radius:9px;background:var(--bg);position:relative;cursor:pointer}
.ck input:checked{background:var(--gr);animation:bounce .4s}
.ck input:checked::after{content:"";position:absolute;left:6px;top:1px;width:7px;height:13px;border:solid var(--ink);border-width:0 3px 3px 0;transform:rotate(45deg)}
.ck input:checked+span{text-decoration:line-through;opacity:.55}
.ck input:focus-visible,.tab:focus-visible,.links a:focus-visible{outline:3px solid var(--co);outline-offset:2px}
footer{text-align:center;font-size:.85rem;margin-top:30px}
.drift{animation:drift 9s ease-in-out infinite alternate}.drift2{animation:drift 12s ease-in-out infinite alternate-reverse}
.plane{animation:fly 22s linear infinite}.sun{animation:pulse 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.boat{animation:bob 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}.fl-i{animation:bob 3s ease-in-out infinite}
@keyframes drift{to{transform:translateX(22px)}}
@keyframes fly{from{transform:translateX(-120px)}to{transform:translateX(420px)}}
@keyframes pulse{50%{transform:scale(1.1)}}
@keyframes bob{50%{transform:translateY(-3px) rotate(2deg)}}
@keyframes bounce{0%{transform:scale(1)}35%{transform:scale(1.14) translateY(-4px)}70%{transform:scale(.95)}100%{transform:scale(1)}}
@keyframes pop{0%{opacity:0;transform:translateY(18px) scale(.94)}60%{opacity:1;transform:translateY(-5px) scale(1.01)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<nav><b>東京七日</b><div class="links"><a href="#home">首頁</a><a href="#flight">航班</a><a href="#plan">行程</a><a href="#stay">住宿</a><a href="#todo">待辦</a><a href="#prep">出發前</a><a href="#pack">行李</a></div></nav>

<div class="in"><h1>東京・河口湖<br>七日小旅行</h1><p class="sub">2026.12.01 – 12.07｜桃園 → 成田 → 河口湖 → 淺草</p>
<div class="cd" aria-live="off"><div><strong id="cd-d">--</strong><span>天</span></div><div><strong id="cd-h">--</strong><span>時</span></div><div><strong id="cd-m">--</strong><span>分</span></div><div><strong id="cd-s">--</strong><span>秒</span></div></div>

<script>
const $=s=>document.querySelector(s);
const TC={飛機:'#A8D3E6',預約車:'#F6D27A',巴士:'#B9DAA5',纜車:'#F2A497',遊船:'#A8D3E6',搭車:'#B9DAA5',自由行:'#F6D27A'};
const S=['07:00–09:00','09:00–12:00','12:00–15:00','15:00–18:00','18:00–21:00','21:00 後'];
const D=[
{d:'12/1',w:'二',t:'啟程，抵達河口湖',n:'住宿：Fujikawaguchiko Resort Hotel',it:[[0,'桃園機場準備登機'],[1,'桃園 → 東京','飛機'],[2,'抵達東京、出關，搭上預約車','預約車'],[3,'成田機場 → 河口湖','預約車'],[4,'飯店晚餐 Buffet'],[5,'休息就寢']]},
{d:'12/2',w:'三',t:'河口湖一日',n:'附近超市：Watahan Super Center',it:[[0,'起床，前往天上山纜車、觀景台','纜車',1],[1,'河口湖遊船，湖畔用餐','遊船'],[2,'搭紅線周遊巴士前往大石公園','巴士'],[3,'花園露台周邊商店逛街'],[4,'Hotokura Funari Kawaguchiko 晚餐'],[5,'返回飯店休息']]},
{d:'12/3',w:'四',t:'新倉山，移動到淺草',it:[[0,'起床、準備退房'],[1,'搭上預約車，前往新倉山淺間神社','預約車',1],[2,'前往山中湖，再前往東京淺草'],[3,'抵達淺草 APA，辦理入住'],[4,'燒肉聚餐'],[5,'返回飯店休息']]},
{d:'12/4',w:'五',t:'分組行動，晴空塔',n:'A組　酆棻岳母　｜　B組　其他全部',it:[[0,'起床。A組往上野，B組搭車往豐洲市場','搭車'],[1,'A組：上野美髮造型｜B組：豐洲市場吃海鮮，再逛台場'],[2,'匯合，前往晴空塔逛街'],[3,'晴空塔登頂 450M，以及墨田水族館','',1],[4,'墨田水族館，晴空塔用餐'],[5,'返回飯店休息']]},
{d:'12/5',w:'六',t:'澀谷、原宿、銀座',n:'Harbs 吃蛋糕',it:[[0,'起床'],[1,'前往東京澀谷'],[2,'澀谷和原宿逛街及用餐'],[3,'澀谷、銀座逛街'],[4,'銀座豬排晚餐'],[5,'返回飯店休息']]},
{d:'12/6',w:'日',t:'自由日，演唱會',n:'YOASOBI 東蛋演唱會',nm:1,it:[[0,'起床'],['09:00–21:00','自由行不安排','自由行'],[5,'返回飯店休息']]},

];

const prep=['確認護照效期','填寫 Visit Japan Web 入境資料','準備日幣現金與信用卡','買好網卡或 eSIM','辦理旅遊保險','機票與兩家飯店確認信存手機','Google 地圖下載離線地圖','行動電源放隨身行李'];

const house='<svg viewBox="0 0 54 54" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"><path d="M6 26L27 8l21 18z" fill="#F2A497"/><rect x="11" y="26" width="32" height="20" rx="3" fill="#FFFCF6"/><rect x="23" y="33" width="9" height="13" fill="#F6D27A"/></svg>';
const tower='<svg viewBox="0 0 54 54" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"><rect x="12" y="6" width="30" height="42" rx="4" fill="#A8D3E6"/><path d="M20 16h4M30 16h4M20 26h4M30 26h4" fill="none" stroke-linecap="round"/><rect x="22" y="36" width="10" height="12" fill="#F6D27A"/></svg>';
const route=(a,b)=>'<div class="rt"><div><strong>'+a+'</strong></div><svg viewBox="0 -18 200 62" overflow="visible" stroke="#3E3A39" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 36Q100-14 192 36" fill="none" stroke-dasharray="2 8"/><g class="fl-i" transform="translate(78 4)"><rect width="40" height="12" rx="6" fill="#FFFCF6"/><path d="M14 0L23-12H29L25 0Z" fill="#F6D27A"/><path d="M0 0L-3-8H4L8 0Z" fill="#F6D27A"/></g></svg><div><strong>'+b+'</strong></div></div>';

function show(i,anim){
 document.querySelectorAll('.tab').forEach((t,k)=>{t.setAttribute('aria-selected',k==i);t.tabIndex=k==i?0:-1});
 const d=D[i];
 $('#panel').innerHTML='<div class="dt">Day '+(i+1)+'｜'+d.t+'</div><div class="dl">'+d.d+'（'+d.w+'）</div><ol class="tl">'+d.it.map(x=>'<li><span class="tm">'+(typeof x[0]=='number'?S[x[0]]:x[0])+'</span>'+x[1]+'<br>'+(x[3]?'<span class="tag must">必去</span>':'')+(x[2]?'<span class="tag" style="--tc:'+TC[x[2]]+'">'+x[2]+'</span>':'')+'</li>').join('')+'</ol>'+(d.n?'<div class="note">'+(d.nm?'<span class="tag must">必去</span> ':'')+d.n+'</div>':'');
 if(anim){const p=$('#panel');p.classList.remove('pop');void p.offsetWidth;p.classList.add('pop')}
}

show(dayNow>=0&&dayNow<7?dayNow:0,0);
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'{}');localStorage.setItem(k,JSON.stringify(v))}catch(e){return {}}}
function list(el,key,groups){
